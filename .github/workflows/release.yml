name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the annotated tag's message is available below.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build all targets
        run: |
          set -eu
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X github.com/DustanBaker/uplink-composer/internal/buildinfo.Version=${VERSION}"
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            out="dist/uplink-${VERSION}-${GOOS}-${GOARCH}${ext}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/uplink
          done
          # Windowless launcher for the click-to-launch app (Windows GUI subsystem).
          for GOARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" \
              -o "dist/uplink-app-${VERSION}-windows-${GOARCH}.exe" ./cmd/uplink-app
          done
          cp uplink.ico dist/uplink.ico
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # The annotated tag's message is the release notes, so what shipped is
          # written once, next to the commits it describes. Kept out of dist/ so
          # it is neither published as an asset nor hashed into SHA256SUMS.
          notes="${RUNNER_TEMP}/notes.md"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > "$notes"
          if [ ! -s "$notes" ]; then
            echo "Cross-platform builds." > "$notes"
          fi
          cat >> "$notes" <<'EOF'

---

Verify downloads against `SHA256SUMS.txt`. Binaries are unsigned for now —
Windows SmartScreen / Smart App Control may object until code signing lands.
EOF
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "The Uplink CompOSer ${GITHUB_REF_NAME}" \
            --notes-file "$notes"
