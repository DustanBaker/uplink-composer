[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsky"
version = "0.0.1"
description = "Builds customized Windows and Linux OS install media: debloated installs, local-account-only setup, and driver injection."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dustan Baker" }]
keywords = [
  "bootable",
  "usb",
  "iso",
  "install-media",
  "unattended",
  "windows",
  "linux",
  "imaging",
  "deployment",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/uplinkresearch/dsky"
Repository = "https://github.com/uplinkresearch/dsky"
Issues = "https://github.com/uplinkresearch/dsky/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dsky"]
