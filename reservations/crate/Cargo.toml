[package]
name = "dsky"
version = "0.0.1"
edition = "2021"
rust-version = "1.70"
description = "Builds customized Windows and Linux OS install media: debloated installs, local-account-only setup, and driver injection."
authors = ["Dustan Baker"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/uplinkresearch/dsky"
repository = "https://github.com/uplinkresearch/dsky"
# crates.io allows at most five keywords, each 20 characters or fewer.
keywords = ["bootable", "usb", "iso", "installer", "imaging"]
categories = ["command-line-utilities"]

[dependencies]
