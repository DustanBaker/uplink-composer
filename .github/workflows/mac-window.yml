name: mac-window
# The macOS window cannot be exercised by `go test` on a machine without a
# desktop, and nobody developing this has a Mac to hand. GitHub's macOS
# runners have a logged-in desktop session, so this opens the real window
# there, checks what it did, and keeps screenshots as evidence.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Test this published release's binary (e.g. v0.7.3) instead of building from source"
        required: false
        default: ""
  push:
    paths:
      - internal/cli/window_darwin.go
      - internal/cli/window_darwin_test.go
      - internal/cli/serve.go
      - internal/cab/**
      - internal/drivers/catalog/**
      - .github/workflows/mac-window.yml

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Built the way releases are built: no cgo.
      - name: Dialogs and closing, in the real window
        timeout-minutes: 4
        env:
          CGO_ENABLED: "0"
          DSKY_MAC_WINDOW_TEST: "1"
          DSKY_SHOT: ${{ runner.temp }}/dialogs.png
        run: go test -count=1 -v ./internal/cli

      - name: The app itself
        timeout-minutes: 4
        env:
          CGO_ENABLED: "0"
          RELEASE: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ -n "${RELEASE:-}" ]; then
            # The artifact people download, cross-compiled on Linux by the
            # release workflow -- not a build of this checkout.
            ARCH=$(uname -m); [ "$ARCH" = x86_64 ] && ARCH=amd64
            gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p "dsky-$RELEASE-darwin-$ARCH" -p SHA256SUMS.txt
            grep " dsky-$RELEASE-darwin-$ARCH\$" SHA256SUMS.txt | shasum -a 256 -c
            mv "dsky-$RELEASE-darwin-$ARCH" dsky && chmod +x dsky
            ./dsky version
          else
            go build -o dsky ./cmd/dsky
          fi
          file dsky
          ./dsky app > app.log 2>&1 &
          APP=$!
          REC="$HOME/Library/Application Support/dsky/portal.json"
          for i in $(seq 1 60); do [ -s "$REC" ] && break; sleep 1; done
          cat "$REC"; echo
          PORT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['port'])" "$REC")
          TOKEN=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token'])" "$REC")
          # The page opens a live event stream from JavaScript as soon as it
          # runs. A connection to the portal from something other than dsky
          # is the WebKit network process, which means the page loaded and its
          # script ran inside the window.
          ok=0
          for i in $(seq 1 45); do
            if lsof -nP -iTCP@127.0.0.1:$PORT -sTCP:ESTABLISHED | awk 'NR>1 && $1 !~ /^dsky/' | grep -q .; then ok=1; break; fi
            sleep 1
          done
          lsof -nP -iTCP@127.0.0.1:$PORT -sTCP:ESTABLISHED || true
          sleep 3
          screencapture -x "${{ runner.temp }}/app.png" || true
          # What the menu bar and Dock call the running app.
          lsappinfo info -only name -only bundlepath $(lsappinfo find pid=$APP) || true
          # Windows on screen belonging to dsky, from the window server itself.
          cat > windows.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pid = Int32(CommandLine.arguments[1])!
          let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]
          let mine = list.filter { ($0[kCGWindowOwnerPID as String] as? Int32) == pid }
          for w in mine { print(w[kCGWindowBounds as String] ?? "", w[kCGWindowLayer as String] ?? "") }
          print("windows: \(mine.count)")
          exit(mine.isEmpty ? 1 : 0)
          SWIFT
          swift windows.swift $APP || { echo "no window on screen for dsky"; cat app.log; exit 1; }
          [ $ok = 1 ] || { echo "the page never connected back to the portal"; cat app.log; exit 1; }
          # Quit, as the page's button does: the window must close and the
          # process end on its own.
          curl -s -X POST -H "X-DSKY-Token: $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:$PORT/api/quit; echo
          for i in $(seq 1 20); do kill -0 $APP 2>/dev/null || { echo "exited ${i}s after Quit"; exit 0; }; sleep 1; done
          echo "still running 20s after Quit"; cat app.log; exit 1

      # Dell and HP publish their model lists as cabinet files. Unpacking them
      # once needed 7-Zip, which a Mac usually lacks, and the picker quietly
      # showed only Lenovo and Framework. DSKY_7Z points at a tool that always
      # fails, so the runner's own 7-Zip can't hide a regression.
      - name: Every vendor's model list, without 7-Zip
        if: inputs.release == ''
        timeout-minutes: 5
        env:
          CGO_ENABLED: "0"
          DSKY_7Z: /usr/bin/false
        run: |
          set -eu
          go build -o models/dsky ./cmd/dsky
          for v in dell hp lenovo framework; do
            n=$(./models/dsky drivers models $v | wc -l)
            echo "$v: $n models"
            [ "$n" -gt 5 ] || { echo "$v list is empty or nearly so"; exit 1; }
          done

      # An update must bring the app back. This checkout, stamped as an older
      # version, updates itself to the latest published release through the
      # page's API, and the new build has to come up with a window of its own.
      - name: Updating reopens the app
        if: inputs.release == ''
        timeout-minutes: 5
        env:
          CGO_ENABLED: "0"
        run: |
          set -u
          go build -ldflags "-X github.com/uplinkresearch/dsky/internal/buildinfo.Version=v0.0.1" -o upd/dsky ./cmd/dsky
          ./upd/dsky version
          REC="$HOME/Library/Application Support/dsky/portal.json"
          rm -f "$REC"
          ./upd/dsky app > upd.log 2>&1 &
          OLD=$!
          for i in $(seq 1 60); do [ -s "$REC" ] && break; sleep 1; done
          PORT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['port'])" "$REC")
          TOKEN=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token'])" "$REC")
          sleep 3
          curl -s -X POST -H "X-DSKY-Token: $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:$PORT/api/update; echo
          NEW=""
          for i in $(seq 1 90); do
            P=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['pid'])" "$REC" 2>/dev/null || true)
            if [ -n "$P" ] && [ "$P" != "$OLD" ] && kill -0 "$P" 2>/dev/null; then NEW=$P; break; fi
            sleep 1
          done
          [ -n "$NEW" ] || { echo "no new process after the update"; ./upd/dsky version; cat upd.log; exit 1; }
          echo "relaunched as pid $NEW; binary now: $(./upd/dsky version)"
          sleep 8
          kill -0 $OLD 2>/dev/null && { echo "old process still running"; exit 1; } || echo "old process gone"
          swift windows.swift $NEW || { echo "the relaunched build has no window"; exit 1; }
          screencapture -x "${{ runner.temp }}/after-update.png" || true
          TOKEN=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['token'])" "$REC")
          PORT=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['port'])" "$REC")
          curl -s -X POST -H "X-DSKY-Token: $TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:$PORT/api/quit; echo
          for i in $(seq 1 20); do kill -0 $NEW 2>/dev/null || { echo "relaunched build exited ${i}s after Quit"; exit 0; }; sleep 1; done
          echo "relaunched build still running after Quit"; exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: warn
